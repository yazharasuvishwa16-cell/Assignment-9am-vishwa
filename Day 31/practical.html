<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Day 31 - Practical Projects</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    button {
      padding: 8px 16px;
      margin: 5px 0;
      cursor: pointer;
    }
    .box {
      border: 1px solid lightgray;
      padding: 15px;
      margin-bottom: 20px;
      max-width: 400px;
    }
    .dark {
      background-color: rgb(20, 19, 19);
      color: #dcd8d8;
    }
  </style>
</head>
<body>

  <h2>Day 31 - Practical Mini Projects</h2>

  <!--  Fetch & Display Users -->
  <div class="box">
    <h3> Fetch User List</h3>
    <button id="fetchUsers">Load Users</button>
    <ul id="userList"></ul>
  </div>

  <!--  Login Status -->
  <div class="box">
    <h3> Login Status (localStorage)</h3>
    <button id="loginBtn">Login</button>
    <button id="logoutBtn">Logout</button>
    <p id="loginStatus"></p>
  </div>

  <!-- Theme Switcher -->
  <div class="box">
    <h3> Theme Switcher</h3>
    <button id="themeBtn">Toggle Theme</button>
  </div>

  <!--  API Error Handling -->
  <div class="box">
    <h3> Fetch API Error Handling</h3>
    <button id="errorBtn">Fetch Wrong API</button>
    <p id="errorResult"></p>
  </div>

  <!-- Cart using JSON + localStorage -->
  <div class="box">
    <h3> Shopping Cart</h3>
    <button id="addCart">Add Item</button>
    <p id="cartItems"></p>
  </div>

  <script>
 
  // Fetch and Display User List
  
    document.getElementById("fetchUsers").addEventListener("click", async () => {
      const res = await fetch("https://jsonplaceholder.typicode.com/users");
      const users = await res.json();

      document.getElementById("userList").innerHTML =
        users.map(user => `<li>${user.name}</li>`).join("");
    });


  //  Save Login Status in localStorage

    const statusText = document.getElementById("loginStatus");

    function updateLoginStatus() {
      const isLoggedIn = localStorage.getItem("loggedIn");
      statusText.textContent = isLoggedIn
        ? "Status: Logged In Successfully"
        : "Status: Logged Out Successfully";
    }

    document.getElementById("loginBtn").onclick = () => {
      localStorage.setItem("loggedIn", "true");
      updateLoginStatus();
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("loggedIn");
      updateLoginStatus();
    };

    updateLoginStatus();

   
  //  Theme Switcher using localStorage

    const themeBtn = document.getElementById("themeBtn");

    function applyTheme() {
      const theme = localStorage.getItem("theme");
      document.body.className = theme === "dark" ? "dark" : "";
    }

    themeBtn.onclick = () => {
      const currentTheme = localStorage.getItem("theme");
      localStorage.setItem("theme", currentTheme === "dark" ? "light" : "dark");
      applyTheme();
    };

    applyTheme();

  //  Fetch API Error Handling

    document.getElementById("errorBtn").onclick = async () => {
      try {
        const res = await fetch("https://wrong-api-url.com/data");
        if (!res.ok) throw new Error("API Failed to fetch");

        const data = await res.json();
        document.getElementById("errorResult").textContent = data;
      } catch (error) {
        document.getElementById("errorResult").textContent =
          "Error fetching data";
      }
    };

  
//  Store Cart Items using JSON + localStorage

    const cartText = document.getElementById("cartItems");

    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function updateCartUI() {
      const cart = getCart();
      cartText.textContent = cart.length
        ? cart.join(", ")
        : "Cart is empty";
    }

    document.getElementById("addCart").onclick = () => {
      const cart = getCart();
      cart.push(`Item ${cart.length + 1}`);
      saveCart(cart);
      updateCartUI();
    };

    updateCartUI();
  </script>

</body>
</html>
