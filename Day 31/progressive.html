<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Day 31 - Progressive Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    button, select {
      padding: 6px 12px;
      margin-top: 10px;
    }
    .card {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <h2>Day 31 - Progressive Project (Real-World API)</h2>

  <!-- User Preference -->
  <label>
    Select Theme:
    <select id="themeSelect">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>

  <br /><br />

  <!-- Fetch API -->
  <button id="loadPosts">Load Posts</button>

  <div id="content"></div>

  <script>
  
    //  Store user preferences in localStorage
 
    const themeSelect = document.getElementById("themeSelect");

    function applyTheme(theme) {
      document.body.style.background =
        theme === "dark" ? "#222" : "#fff";
      document.body.style.color =
        theme === "dark" ? "#fff" : "#000";
    }

    // Load saved theme
    const savedTheme = localStorage.getItem("theme") || "light";
    themeSelect.value = savedTheme;
    applyTheme(savedTheme);

    themeSelect.addEventListener("change", () => {
      localStorage.setItem("theme", themeSelect.value);
      applyTheme(themeSelect.value);
    });

    /*
      Fetch API + Async/Await
      JSON handling
      Real-world REST API simulation
      */
    const contentDiv = document.getElementById("content");

    async function fetchPosts() {
      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts?_limit=3"
        );

        if (!response.ok) {
          throw new Error("API Error");
        }

        // JSON handling
        const posts = await response.json();

        renderPosts(posts);
      } catch (error) {
        contentDiv.textContent = "Failed to load data ❌";
      }
    }

    function renderPosts(posts) {
      contentDiv.innerHTML = posts
        .map(
          post => `
          <div class="card">
            <h4>${post.title}</h4>
            <p>${post.body}</p>
          </div>
        `
        )
        .join("");
    }

    document
      .getElementById("loadPosts")
      .addEventListener("click", fetchPosts);
  </script>

</body>
</html>
